{% if page.comments and site.disqus_shortname %}
<script>
    var disqus_config = function () {
        this.page.url = {{ page.url | absolute_url | jsonify }};
        /* Preserve the existing URL identity unless an identifier is supplied. */
        {% if page.disqus_identifier %}
        this.page.identifier = {{ page.disqus_identifier | jsonify }};
        {% endif %}
        this.page.title = {{ page.title | jsonify }};
        this.language = 'es_MX';
    };
    (function () {
        var script = document.createElement('script');
        script.src = 'https://' + {{ site.disqus_shortname | jsonify }} + '.disqus.com/embed.js';
        script.async = true;
        script.setAttribute('data-timestamp', +new Date());
        (document.head || document.body).appendChild(script);
    }());
</script>
<noscript>Activa JavaScript para leer y escribir comentarios con Disqus.</noscript>
<p class="comments-help">Comentarios con Disqus. Si no aparecen, revisa si tu navegador bloquea este servicio.
<a href="{{ '/contacto/' | relative_url }}">También puedes escribirme directamente.</a></p>
{% endif %}
