{% if site.google.analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google.analytics | escape }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', {{ site.google.analytics | jsonify }});
</script>
{% endif %}
